services:
  - type: web
    plan: free
    name: southart
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn onlinestore.asgi:application -k uvicorn.workers.UvicornWorker'
envVars:
  - key: DATABASE_URL
    sync: false        # tells Render: set this manually in the dashboard
  - key: SECRET_KEY
    generateValue: true
  - key: WEB_CONCURRENCY
    value: 4
